title: Lite IPTV
iconUri: https://raw.githubusercontent.com/Zyanoo/liteiptv/main/icon.png
manifestUrl: https://github.com/Zyanoo/liteiptv/releases/latest/download/com.homebrew.liteiptv.manifest.json
category: multimedia
pool: main
shortDescription: Simple M3U / UDP IPTV player.
description: |
  Lite IPTV is a lightweight IPTV player for webOS TVs.

  - Plays channels from an M3U / M3U8 playlist URL (HLS and MPEG-TS)
  - UDP multicast streams supported
  - Optional: edit settings from your phone (needs Homebrew Channel root)
